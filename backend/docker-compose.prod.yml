# Willay · PRODUCCIÓN
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias clave frente a desarrollo:
#   · perfil prod  → la base arranca VACÍA (sin datos demo)
#   · secretos por variables de entorno (archivo .env, nunca en git)
#   · PostgreSQL SIN puerto publicado: solo accesible desde la red interna
#   · reinicio automático y límites de log
services:
  db:
    image: postgres:16-alpine
    container_name: willay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME}
      POSTGRES_USER: ${DB_USER:?falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - willay_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: .
    container_name: willay-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      CORS_ORIGENES: ${CORS_ORIGENES:?falta CORS_ORIGENES}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      # Opcionales a propósito: sin clave, CorreoService simplemente no envía
      # (lo avisa en el log) — nunca debe impedir que el backend arranque.
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      # Igual de opcionales: sin claves VAPID, PushNotificacionService no
      # envía nada (lo avisa en el log) y el resto del sistema sigue normal.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Push nativo (app Android). Igual de opcional que VAPID arriba: sin
      # ninguna credencial configurada, PushNotificacionService simplemente
      # no manda por este canal (lo avisa en el log) y el resto sigue igual.
      #
      # Forma recomendada (más segura): guarda el .json de la cuenta de
      # servicio de Firebase en el servidor, FUERA de este repo — por
      # ejemplo en /root/secrets/willay-firebase.json, con permisos
      # restringidos (chmod 600) — y entonces:
      #   1) descomenta la línea del volumen más abajo
      #   2) descomenta esta línea
      # Dejarlo comentado (como está) es 100% seguro: no rompe nada, el
      # push nativo simplemente queda deshabilitado hasta que lo actives.
      # FIREBASE_CREDENTIALS_PATH: /run/secrets/willay-firebase.json
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_FILE: /var/log/willay/willay.log
    volumes:
      - ./logs:/var/log/willay
      # Ver arriba: descomenta esta línea SOLO después de crear el archivo
      # /root/secrets/willay-firebase.json en el servidor — si el archivo
      # no existe, Docker crea una carpeta vacía en su lugar y el backend
      # falla al leer la credencial.
      # - /root/secrets/willay-firebase.json:/run/secrets/willay-firebase.json:ro
    ports:
      - "127.0.0.1:8080:8080"   # solo local: el proxy TLS publica al exterior
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  willay_pgdata:
