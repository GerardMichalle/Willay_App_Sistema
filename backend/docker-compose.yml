# Willay · entorno de DESARROLLO local
# Un solo comando:  docker compose up --build
# Incluye datos de demostración (perfil dev).
services:
  db:
    image: postgres:16-alpine
    container_name: willay-db
    environment:
      POSTGRES_DB: willay
      POSTGRES_USER: willay
      POSTGRES_PASSWORD: willay-local
    ports:
      - "5432:5432"
    volumes:
      - willay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willay -d willay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: willay-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/willay
      DB_USER: willay
      DB_PASSWORD: willay-local
      CORS_ORIGENES: http://localhost:5173
      # Sin clave: CorreoService lo detecta y solo lo avisa en el log, no
      # intenta enviar nada. Pon una clave real de prueba aquí si quieres
      # ver los correos de verdad en desarrollo.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Willay <onboarding@resend.dev>}
      # Mismo par de claves que se entregó para el .env del servidor: reutilizarlas
      # en desarrollo es seguro (no son un secreto compartido con nadie más, solo
      # identifican a "este servidor" ante los navegadores) y permite probar
      # notificaciones push reales en local sin generar un segundo par.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BP9Gqj-xWMXX2QrOjgM1zvoUaRjTt_xn6MS40m0hJd0jx0aTflIKtpBv1QUR99uAE3QFX-U_O_7zzaEJy79hA54}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-yGJOblVXq-a1AnLtQrnMQ5EVE0R4mJX9J7Bgmi9IpfM}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@willay.app}
    ports:
      - "8080:8080"

volumes:
  willay_pgdata:
