# ─────────────────────────────────────────────────────────────────────
# Configuración BASE — común a todos los entornos.
# Lo específico de cada entorno vive en application-{perfil}.yml
# Perfil por defecto: dev (para que un clon del repo arranque sin flags)
# ─────────────────────────────────────────────────────────────────────
spring:
  application:
    name: willay-backend

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/willay}
    username: ${DB_USER:willay}
    password: ${DB_PASSWORD:willay-local}
    hikari:
      pool-name: willay-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo gobierna Flyway; JPA solo valida
    open-in-view: false         # evita consultas perezosas fuera de la transacción
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
          batch_size: 50

  flyway:
    enabled: true
    # locations se define por perfil: prod NO carga db/seed
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX:25MB}
      max-request-size: ${UPLOAD_MAX:25MB}

server:
  port: ${PORT:8080}
  error:
    include-message: never      # no filtrar detalles internos en respuestas
    include-stacktrace: never
  compression:
    enabled: true

willay:
  jwt:
    secreto: ${JWT_SECRET:}
    duracion-acceso-min: ${JWT_ACCESS_MIN:30}
    duracion-refresh-dias: ${JWT_REFRESH_DIAS:14}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  correo:
    resend-api-key: ${RESEND_API_KEY:}
    remitente: ${RESEND_FROM:Willay <onboarding@resend.dev>}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:soporte@willay.app}
    # Cuenta de servicio de Firebase (Project Settings → Service Accounts →
    # Generate new private key). Preferir firebase-credentials-path (archivo
    # en el servidor) sobre firebase-credentials-json (contenido pegado como
    # variable de entorno) — ver PushNotificacionService.inicializarFirebase.
    # Igual que VAPID: sin ninguna de las dos, el envío nativo se omite y se
    # registra en el log.
    firebase-credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    firebase-credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  # Cuenta del proveedor creada al primer arranque si la base está vacía
  bootstrap:
    habilitado: ${BOOTSTRAP_ENABLED:true}
    correo: ${BOOTSTRAP_EMAIL:}
    password: ${BOOTSTRAP_PASSWORD:}
    nombres: ${BOOTSTRAP_NOMBRES:Soporte}
    apellidos: ${BOOTSTRAP_APELLIDOS:Willay}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
