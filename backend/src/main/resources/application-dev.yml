# ── DESARROLLO local: incluye datos de demostración ──
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # ← carga la semilla demo
    # La semilla demo vive en V900: cualquier migración nueva (V5, V6…) queda
    # "fuera de orden" frente a ella. Sin esto, Flyway se niega a aplicarla.
    out-of-order: true
  jpa:
    show-sql: false

willay:
  jwt:
    # Secreto fijo SOLO para desarrollo. Nunca usar en producción.
    secreto: ${JWT_SECRET:desarrollo-local-willay-secreto-de-al-menos-32-caracteres!}
  bootstrap:
    correo: ${BOOTSTRAP_EMAIL:soporte@willay.pe}
    password: ${BOOTSTRAP_PASSWORD:demo1234}

logging:
  level:
    com.willay: DEBUG
    org.springframework.security: INFO
